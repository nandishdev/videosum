<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles in background -->
  <circle cx="150" cy="100" r="120" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="1050" cy="530" r="150" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Left side: Video/Media Icon -->
  <g transform="translate(200, 200)">
    <!-- Play button background circle -->
    <circle cx="100" cy="100" r="90" fill="url(#accentGradient)" filter="url(#glow)"/>
    
    <!-- Play button triangle -->
    <polygon points="70,65 70,135 145,100" fill="white"/>
    
    <!-- Accent sparkles -->
    <g opacity="0.8">
      <circle cx="200" cy="50" r="8" fill="#fbbf24"/>
      <circle cx="220" cy="80" r="6" fill="#fbbf24"/>
      <circle cx="50" cy="170" r="7" fill="#fbbf24"/>
    </g>
  </g>
  
  <!-- Right side: Arrow and Text -->
  <g transform="translate(550, 150)">
    <!-- Arrow -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#fbbf24" />
      </marker>
    </defs>
    <line x1="0" y1="40" x2="150" y2="40" stroke="#fbbf24" stroke-width="6" marker-end="url(#arrowhead)"/>
    
    <!-- Waveform lines -->
    <line x1="20" y1="20" x2="20" y2="60" stroke="#3b82f6" stroke-width="4" opacity="0.7"/>
    <line x1="40" y1="10" x2="40" y2="70" stroke="#3b82f6" stroke-width="4" opacity="0.7"/>
    <line x1="60" y1="25" x2="60" y2="55" stroke="#3b82f6" stroke-width="4" opacity="0.7"/>
  </g>
  
  <!-- Main Text -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="2">
    VideoSumm
  </text>
  
  <!-- Tagline -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#fbbf24" font-weight="500">
    Transform Media into Insight
  </text>
  
  <!-- AI Badge -->
  <g transform="translate(600, 510)">
    <rect x="-80" y="-20" width="160" height="50" rx="25" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#8b5cf6" font-weight="600">
      Powered by Gemini AI
    </text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="600" x2="1100" y2="600" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6"/>
</svg>